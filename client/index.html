<!DOCTYPE html>
<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MangaYomu</title>
    <!-- Blocking script: apply saved theme BEFORE render to prevent flash -->
    <script>(function(){try{var t=localStorage.getItem("manga-theme");if(t==="dark"||(t===null&&window.matchMedia("(prefers-color-scheme:dark)").matches))document.documentElement.classList.add("dark")}catch(e){}})()</script>
    <link rel="stylesheet" href="/src/style.css" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  </head>
  <body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100">
    <div id="app" class="min-h-screen"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
